spring:
  application:
    name: mdr

  datasource:
    url: jdbc:mysql://db:3306/payu?allowPublicKeyRetrieval=true&useSSL=false
    username: payu
    password: payu
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

  mdr:
  dedup:
    window-hours: 24