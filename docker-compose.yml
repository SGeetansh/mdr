services:
  app:
    build: .
    container_name: payu-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
    working_dir: /workspace

  db:
    image: mysql:8
    container_name: payu-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payu
      MYSQL_USER: payu
      MYSQL_PASSWORD: payu
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "payu", "-ppayu"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
